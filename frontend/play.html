<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShatrunZ - 9x9 Chess Variant</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="play-page">
    <div class="main-layout play-minimal">
        <div class="left-panel lichess-moves-panel">
            <div class="panel-section moves-panel">
                <div class="section-header">
                    <h3>Moves</h3>
                    <button id="export-pgn" class="btn-icon" title="Export PGN">📥</button>
                </div>
                <div id="live-nav-controls" class="move-nav-bar" aria-label="Move navigation">
                    <button id="nav-start" class="btn icon-btn" title="Start">⏮</button>
                    <button id="nav-back" class="btn icon-btn" title="Step back">◀</button>
                    <button id="nav-forward" class="btn icon-btn" title="Step forward">▶</button>
                    <button id="nav-end" class="btn icon-btn" title="End">⏭</button>
                    <button type="button" class="btn icon-btn move-menu-btn" title="Menu" disabled>☰</button>
                </div>
                <div id="move-list" class="move-list lichess-move-list">No moves yet</div>
            </div>
        </div>

        <div class="board-area">
            <div class="user-tag top">
                <span class="user-icon">👤</span>
                <div class="user-info">
                    <span id="opponent-name">Opponent</span>
                    <span id="opponent-time" class="move-time">--</span>
                </div>
                <div id="engine-pv-top" class="engine-pv-panel" aria-live="polite"></div>
            </div>

            <div id="board"></div>

            <div class="user-tag bottom">
                <span class="user-icon">👤</span>
                <div class="user-info">
                    <span id="player-name">You</span>
                    <span id="player-time" class="move-time">--</span>
                </div>
                <div id="engine-pv-bottom" class="engine-pv-panel" aria-live="polite"></div>
                <div id="thinking-indicator"></div>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">
                <h1>ShatrunZ <span class="version">9x9</span></h1>
            </div>

            <nav class="mode-nav" aria-label="Game mode">
                <a href="/" class="mode-nav-link">Home</a>
                <a href="/pvp" class="mode-nav-link" data-mode="hvh">PvP</a>
                <a href="/pvai" class="mode-nav-link" data-mode="hvc">PvAI</a>
                <a href="/aivai" class="mode-nav-link" data-mode="cvc">AIvAI</a>
                <a href="/admin" class="mode-nav-link mode-nav-admin">Admin</a>
            </nav>

            <div class="game-status">
                <div id="status">White's Turn</div>
                <div id="eval-display" class="eval-display">+0.0</div>
                <div id="engine-status" class="engine-status">Engine: —</div>
                <div id="scoreboard" class="scoreboard-secondary">Material: Equal</div>
            </div>

            <div id="move-explanation" class="move-explanation" aria-live="polite"></div>

            <div class="controls-panel">
                <div id="play-as-group" class="control-group">
                    <label>Play As</label>
                    <select id="computer-side">
                        <option value="black" selected>White (You) vs Black (AI)</option>
                        <option value="white">Black (You) vs White (AI)</option>
                    </select>
                </div>

                <div id="aivai-only-controls" class="control-group" style="display:none">
                    <label>White AI</label>
                    <select id="white-ai-strategy">
                        <option value="material" selected>Material</option>
                        <option value="positional">Positional</option>
                        <option value="aggressive">Aggressive</option>
                        <option value="c_native">C Engine</option>
                    </select>
                    <label>Black AI</label>
                    <select id="black-ai-strategy">
                        <option value="material">Material</option>
                        <option value="positional" selected>Positional</option>
                        <option value="aggressive">Aggressive</option>
                        <option value="c_native">C Engine</option>
                    </select>
                </div>

                <div class="action-buttons">
                    <button id="btn-undo" class="btn secondary">↶ Undo</button>
                    <button id="reset-game" class="btn secondary">New Game</button>
                </div>

                <div class="ai-controls">
                    <button id="start-auto" class="btn primary">Start AI</button>
                    <button id="stop-auto" class="btn danger" disabled>Stop</button>
                    <button id="btn-help-ai" class="btn secondary" style="display:none">Help AI</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/main.js"></script>
</body>

</html>
