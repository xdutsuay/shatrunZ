[shatrunz:chess]
maxRank = 9
maxFile = 9
startFen = rnbqkbznr/ppppppppp/9/9/9/9/9/PPPPPPPPP/RNBQKBZNR w - - 0 1

# Piece set includes our Krishna piece (Z/z).
# NOTE: This config defines Krishna as mK (king-move, non-royal).
# Our variant rules differ (Krishna cannot capture, does not give check).
# Fairy-Stockfish cannot exactly model “non-capturing king-move” with pure piece defs;
# treat this as an approximation for sparring/training until we formalize a compatible rule set.
pieceToCharTable = PNBRQ..........K.......Z.......pnbrq..........k.......z
customPiece1 = z:mK

