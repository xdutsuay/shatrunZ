<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShatrunZ - 9x9 Chess Variant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-layout">
        <!-- LEFT PANEL: PGN & History -->
        <div class="left-panel">
            <div class="panel-section">
                <div class="section-header">
                    <h3>Moves</h3>
                    <button id="export-pgn" class="btn-icon" title="Export PGN">📥</button>
                </div>
                <div id="move-list" class="move-list">No moves yet</div>
            </div>

            <div class="panel-section">
                <div class="section-header">
                    <h3>Game History</h3>
                    <button id="clear-history" class="btn-icon" title="Clear History">🗑️</button>
                </div>
                <select id="game-history" size="8" class="history-select"></select>
                <button id="load-game" class="btn secondary small full-width">Load Selected</button>
            </div>

            <div class="panel-section">
                <div class="section-header">
                    <h3>Brain Stats</h3>
                </div>
                <div id="brain-stats" class="brain-stats-detail"></div>
            </div>
        </div>

        <!-- CENTER: Board -->
        <div class="board-area">
            <div class="user-tag top">
                <span class="user-icon">👤</span>
                <div class="user-info">
                    <span id="opponent-name">Opponent</span>
                    <span id="opponent-time" class="move-time">--</span>
                </div>
            </div>

            <div id="board"></div>

            <div class="user-tag bottom">
                <span class="user-icon">👤</span>
                <div class="user-info">
                    <span id="player-name">You</span>
                    <span id="player-time" class="move-time">--</span>
                </div>
                <div id="thinking-indicator"></div>
            </div>
        </div>

        <!-- RIGHT PANEL: Controls -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>ShatrunZ <span class="version">9x9</span></h1>
            </div>

            <div class="game-status">
                <div id="status">White's Turn</div>
                <div id="scoreboard">Material: Equal</div>
            </div>

            <div class="tabs">
                <button id="mode-hvh" class="tab-btn active">PvP</button>
                <button id="mode-hvc" class="tab-btn">PvAI</button>
                <button id="mode-cvc" class="tab-btn">AIvAI</button>
            </div>

            <div class="controls-panel">
                <div class="control-group">
                    <label>AI Level <span id="ai-level-label" class="badge">3</span></label>
                    <input id="ai-level" type="range" min="1" max="5" value="3">
                </div>

                <div class="control-group">
                    <label>AI Strategy</label>
                    <select id="ai-strategy">
                        <option value="material" selected>Material</option>
                        <option value="positional">Positional</option>
                        <option value="aggressive">Aggressive</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>
                        <input type="checkbox" id="use-c-engine" checked>
                        Use C Engine (100x faster!)
                    </label>
                    <small class="hint">Uncheck to use JavaScript AI</small>
                </div>

                <div class="control-group">
                    <label>
                        <input type="checkbox" id="add-randomness">
                        Add Randomness
                    </label>
                    <small class="hint">Prevents repetitive games (adds ±50 to eval)</small>
                </div>

                <div class="control-group">
                    <label>Play As</label>
                    <select id="computer-side">
                        <option value="black" selected>White (You) vs Black (AI)</option>
                        <option value="white">Black (You) vs White (AI)</option>
                    </select>
                </div>

                <div class="action-buttons">
                    <button id="btn-undo" class="btn secondary">↶ Undo</button>
                    <button id="reset-game" class="btn secondary">New Game</button>
                </div>

                <div class="ai-controls">
                    <button id="start-auto" class="btn primary">Start AI</button>
                    <button id="stop-auto" class="btn danger" disabled>Stop</button>
                </div>

                <button id="btn-hyper-train" class="btn warning full-width">
                    ⚡ Hyper-Train (50 Games)
                </button>

                <div class="brain-controls">
                    <button id="export-brain" class="btn text-only">Export Brain</button>
                    <button id="import-brain" class="btn text-only">Import Brain</button>
                    <button id="reset-brain" class="btn text-only">Reset Brain</button>
                    <input type="file" id="brain-file" accept=".json" style="display:none">
                </div>
            </div>
        </div>
    </div>

    <!-- Training Overlay -->
    <div id="training-overlay">
        <div class="overlay-content">
            <h2>🧠 Hyper-Training...</h2>
            <div id="train-status">Simulating Game 1/50</div>
            <div class="progress-container">
                <div id="train-progress" class="progress-bar"></div>
            </div>
            <button id="cancel-train" class="btn danger">Cancel</button>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
